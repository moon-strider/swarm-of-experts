[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarm-of-experts"
version = "0.1.0"
description = "A swarm of experts implementation using FastAPI and LangChain"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "moon-strider" }
]
dependencies = [
    "fastapi[standard]==0.115.14",
    "langchain==0.3.26",
    "langchain-core==0.3.68",
    "langchain-community==0.3.27",
    "langchain-openai==0.3.27",
    "langchain-anthropic==0.3.17",
    "langchain-google-genai==2.1.6",
    "langchain-deepseek==0.1.3",
    "langchain-groq==0.3.1",
    "uvicorn==0.35.0",
    "python-dotenv==1.1.1"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
swarm-of-experts = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
