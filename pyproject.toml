[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "swarm-of-experts"
version = "0.2.0"
description = "Bounded model ensembles behind a transparent Chat Completions API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "moon-strider"}]
dependencies = ["fastapi>=0.141.1,<1", "starlette>=1.3.1,<2", "pydantic>=2.12,<3", "httpx>=0.28,<1", "uvicorn>=0.35,<1"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "pytest-cov>=7,<8", "ruff>=0.15,<1", "mypy>=1.19,<3", "pip-audit>=2.10,<3", "openai>=2,<3"]

[project.scripts]
swarm-of-experts = "swarm_of_experts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swarm_of_experts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC110", "ASYNC240"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true

[tool.coverage.run]
branch = true
source = ["swarm_of_experts"]

[tool.coverage.report]
fail_under = 85
show_missing = true
